<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="770" viewBox="0 0 1620 770" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="1620" height="770" fill="#fff"/><text x="40" y="50" font-size="24" font-weight="bold"  fill="#111827" >Esquema de la solución · React → API REST (Node.js + Express en EC2) → PostgreSQL (RDS)</text><text x="40" y="78" font-size="14"   fill="#4b5563" >Cada capa del backend tiene una sola responsabilidad. La seguridad atraviesa las rutas protegidas antes de llegar al controlador.</text><rect x="40" y="140" width="300" height="380" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="190" y="166" font-size="17" font-weight="bold" text-anchor="middle" fill="#4f46e5" >Frontend React (Vite)</text><text x="190" y="192" font-size="13"  text-anchor="middle" fill="#111827" >Repositorio ProtecoFullstackllVolcan</text><text x="190" y="212" font-size="13"  text-anchor="middle" fill="#111827" >Páginas y Atomic Design</text><text x="190" y="232" font-size="13"  text-anchor="middle" fill="#111827" >services/ → cliente HTTP (fetch)</text><text x="190" y="252" font-size="13"  text-anchor="middle" fill="#111827" >Token de acceso en memoria</text><text x="190" y="272" font-size="13"  text-anchor="middle" fill="#111827" >(Context; no localStorage)</text><text x="190" y="292" font-size="13"  text-anchor="middle" fill="#111827" >Estados: carga, éxito, vacío,</text><text x="190" y="312" font-size="13"  text-anchor="middle" fill="#111827" >error de validación, sesión</text><text x="190" y="332" font-size="13"  text-anchor="middle" fill="#111827" >vencida y sin permiso</text><text x="190" y="352" font-size="13"  text-anchor="middle" fill="#111827" >Validación de formularios</text><text x="190" y="372" font-size="13"  text-anchor="middle" fill="#111827" >(ayuda al usuario)</text><rect x="420" y="110" width="760" height="560" rx="14" fill="#f9fafb" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6"/><text x="440" y="138" font-size="15" font-weight="bold"  fill="#374151" >EC2 lab-springboot · servicio systemd «gas-el-volcan-api» · Node.js 22 + Express 5</text><rect x="450" y="160" width="700" height="58" rx="8" fill="#fff" stroke="#ea580c" stroke-width="2"/><text x="470" y="184" font-size="15" font-weight="bold"  fill="#9a3412" >Middlewares globales</text><text x="470" y="205" font-size="13"   fill="#111827" >helmet · CORS con lista blanca · JSON ≤ 20 kB · logs pino sin secretos</text><rect x="450" y="230" width="700" height="58" rx="8" fill="#fff" stroke="#ea580c" stroke-width="2"/><text x="470" y="254" font-size="15" font-weight="bold"  fill="#9a3412" >Rutas (routes/)</text><text x="470" y="275" font-size="13"   fill="#111827" >Método + ruta → middlewares → controlador · /api/docs (Swagger UI)</text><rect x="450" y="300" width="700" height="58" rx="8" fill="#fff" stroke="#ea580c" stroke-width="2"/><text x="470" y="324" font-size="15" font-weight="bold"  fill="#9a3412" >Seguridad (security/)</text><text x="470" y="345" font-size="13"   fill="#111827" >autenticar(): verifica JWT y vuelve a leer el usuario · autorizar(rol) · límite de intentos</text><rect x="450" y="370" width="700" height="58" rx="8" fill="#fff" stroke="#ea580c" stroke-width="2"/><text x="470" y="394" font-size="15" font-weight="bold"  fill="#9a3412" >Controladores (controllers/)</text><text x="470" y="415" font-size="13"   fill="#111827" >Validan la entrada con schemas/ y responden con el estado HTTP</text><rect x="450" y="440" width="700" height="58" rx="8" fill="#fff" stroke="#ea580c" stroke-width="2"/><text x="470" y="464" font-size="15" font-weight="bold"  fill="#9a3412" >Servicios (services/)</text><text x="470" y="485" font-size="13"   fill="#111827" >Reglas del negocio y transacciones (precio, stock, estados, propiedad)</text><rect x="450" y="510" width="700" height="58" rx="8" fill="#fff" stroke="#ea580c" stroke-width="2"/><text x="470" y="534" font-size="15" font-weight="bold"  fill="#9a3412" >Acceso a datos (repositories/)</text><text x="470" y="555" font-size="13"   fill="#111827" >SQL parametrizado con pg · un pool de conexiones TLS</text><rect x="450" y="580" width="700" height="58" rx="8" fill="#fff" stroke="#ea580c" stroke-width="2"/><text x="470" y="604" font-size="15" font-weight="bold"  fill="#9a3412" >Modelos y DTO (schemas/)</text><text x="470" y="625" font-size="13"   fill="#111827" >Campos aceptados (zod .strict) y datos devueltos, sin hash ni claves</text><rect x="1260" y="200" width="320" height="260" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="1420" y="226" font-size="17" font-weight="bold" text-anchor="middle" fill="#2563eb" >PostgreSQL 18 · Amazon RDS</text><text x="1420" y="252" font-size="13"  text-anchor="middle" fill="#111827" >Base gas_el_volcan</text><text x="1420" y="272" font-size="13"  text-anchor="middle" fill="#111827" >Privada (sin IP pública)</text><text x="1420" y="292" font-size="13"  text-anchor="middle" fill="#111827" >Puerto 5432 solo desde</text><text x="1420" y="312" font-size="13"  text-anchor="middle" fill="#111827" >el grupo de seguridad de EC2</text><text x="1420" y="332" font-size="13"  text-anchor="middle" fill="#111827" >Restricciones: PK, FK, UNIQUE,</text><text x="1420" y="352" font-size="13"  text-anchor="middle" fill="#111827" >CHECK (las reglas viven aquí)</text><text x="1420" y="372" font-size="13"  text-anchor="middle" fill="#111827" >Migraciones versionadas</text><line x1="342" y1="300" x2="446" y2="300" stroke="#1f2937" stroke-width="3" marker-end="url(#f)"/><text x="380" y="288" font-size="13"  text-anchor="middle" fill="#111827" >HTTPS*</text><text x="380" y="324" font-size="12"  text-anchor="middle" fill="#111827" >JSON + Bearer</text><line x1="446" y1="350" x2="342" y2="350" stroke="#1f2937" stroke-width="3" marker-end="url(#f)"/><text x="380" y="372" font-size="12"  text-anchor="middle" fill="#111827" >JSON + estado</text><line x1="1152" y1="580" x2="1256" y2="380" stroke="#1f2937" stroke-width="3" marker-end="url(#f)"/><text x="1220" y="520" font-size="13"   fill="#111827" >TCP 5432 · TLS</text><text x="40" y="720" font-size="13"   fill="#b45309" >* HTTPS diseñado con proxy inverso (nginx + certificado). En AWS Academy no hay dominio y la IP cambia al reiniciar: queda pendiente y documentado en el README.</text><text x="40" y="745" font-size="13"   fill="#374151" >El servidor calcula precio, total, número, estado y dueño de cada pedido; nunca confía en esos valores si los envía el navegador.</text></svg>