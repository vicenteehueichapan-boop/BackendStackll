<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1414" viewBox="0 0 1400 1414" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="1400" height="1414" fill="#fff"/><text x="40" y="44" font-size="22" font-weight="bold"  fill="#111827" >Secuencia · inicio de sesión con JWT y solicitud a una ruta protegida (con casos de rechazo)</text><rect x="5" y="70" width="170" height="40" rx="8" fill="#1e3a8a"/><text x="90" y="96" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff" >Usuario</text><line x1="90" y1="110" x2="90" y2="1610" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 6"/><rect x="245" y="70" width="170" height="40" rx="8" fill="#1e3a8a"/><text x="330" y="96" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff" >React</text><line x1="330" y1="110" x2="330" y2="1610" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 6"/><rect x="555" y="70" width="170" height="40" rx="8" fill="#1e3a8a"/><text x="640" y="96" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff" >API (Express)</text><line x1="640" y1="110" x2="640" y2="1610" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 6"/><rect x="845" y="70" width="170" height="40" rx="8" fill="#1e3a8a"/><text x="930" y="96" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff" >Seguridad</text><line x1="930" y1="110" x2="930" y2="1610" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 6"/><rect x="1115" y="70" width="170" height="40" rx="8" fill="#1e3a8a"/><text x="1200" y="96" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff" >PostgreSQL</text><line x1="1200" y1="110" x2="1200" y2="1610" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 6"/><rect x="20" y="126" width="1360" height="30" fill="#e0e7ff"/><text x="40" y="146" font-size="15" font-weight="bold"  fill="#312e81" >1 · Inicio de sesión exitoso</text><line x1="90" y1="180" x2="326" y2="180" stroke="#1f2937" stroke-width="2"  marker-end="url(#f)"/><text x="210" y="173" font-size="13"  text-anchor="middle" fill="#111827" >Escribe correo y contraseña en Ingreso</text><line x1="330" y1="222" x2="636" y2="222" stroke="#1f2937" stroke-width="2"  marker-end="url(#f)"/><text x="485" y="215" font-size="13"  text-anchor="middle" fill="#111827" >POST /api/auth/login {correo, contrasena} por HTTPS</text><rect x="430" y="242" width="420" height="30" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="640" y="262" font-size="12"  text-anchor="middle" fill="#111827" >Límite: 5 fallos por cuenta y 20 por IP / 15 min</text><line x1="640" y1="304" x2="1196" y2="304" stroke="#1f2937" stroke-width="2"  marker-end="url(#f)"/><text x="920" y="297" font-size="13"  text-anchor="middle" fill="#111827" >SELECT usuario por correo (incluye hash)</text><line x1="1200" y1="346" x2="644" y2="346" stroke="#1f2937" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#f)"/><text x="920" y="339" font-size="13"  text-anchor="middle" fill="#111827" >usuario { id, estado, hash, version_sesion }</text><line x1="640" y1="388" x2="926" y2="388" stroke="#1f2937" stroke-width="2"  marker-end="url(#f)"/><text x="785" y="381" font-size="13"  text-anchor="middle" fill="#111827" >argon2.verify(hash, contraseña)</text><line x1="930" y1="430" x2="644" y2="430" stroke="#1f2937" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#f)"/><text x="785" y="423" font-size="13"  text-anchor="middle" fill="#111827" >válida · cuenta activa</text><line x1="640" y1="472" x2="926" y2="472" stroke="#1f2937" stroke-width="2"  marker-end="url(#f)"/><text x="785" y="465" font-size="13"  text-anchor="middle" fill="#111827" >firmar JWT HS256 {sub, iss, aud, iat, exp=+15 min, jti, ver}</text><line x1="640" y1="514" x2="334" y2="514" stroke="#1f2937" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#f)"/><text x="485" y="507" font-size="13"  text-anchor="middle" fill="#111827" >200 {accessToken, tokenType: "Bearer", expiresIn: 900}</text><rect x="120" y="534" width="420" height="30" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="330" y="554" font-size="12"  text-anchor="middle" fill="#111827" >Guarda el token solo en memoria (Context)</text><rect x="20" y="572" width="1360" height="30" fill="#e0e7ff"/><text x="40" y="592" font-size="15" font-weight="bold"  fill="#312e81" >2 · Solicitud a una ruta protegida: GET /api/auth/me</text><line x1="330" y1="626" x2="636" y2="626" stroke="#1f2937" stroke-width="2"  marker-end="url(#f)"/><text x="485" y="619" font-size="13"  text-anchor="middle" fill="#111827" >GET /api/auth/me · Authorization: Bearer &lt;token&gt;</text><line x1="640" y1="668" x2="926" y2="668" stroke="#1f2937" stroke-width="2"  marker-end="url(#f)"/><text x="785" y="661" font-size="13"  text-anchor="middle" fill="#111827" >autenticar(): firma, alg = HS256, iss, aud, exp</text><line x1="930" y1="710" x2="1196" y2="710" stroke="#1f2937" stroke-width="2"  marker-end="url(#f)"/><text x="1065" y="703" font-size="13"  text-anchor="middle" fill="#111827" >SELECT usuario por sub</text><line x1="1200" y1="752" x2="934" y2="752" stroke="#1f2937" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#f)"/><text x="1065" y="745" font-size="13"  text-anchor="middle" fill="#111827" >estado = activo · version_sesion = ver</text><rect x="720" y="772" width="420" height="30" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="930" y="792" font-size="12"  text-anchor="middle" fill="#111827" >autorizar(rol) y propiedad del registro</text><line x1="640" y1="834" x2="334" y2="834" stroke="#1f2937" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#f)"/><text x="485" y="827" font-size="13"  text-anchor="middle" fill="#111827" >200 perfil (sin hash, sin claves)</text><rect x="20" y="852" width="1360" height="30" fill="#e0e7ff"/><text x="40" y="872" font-size="15" font-weight="bold"  fill="#312e81" >3 · Rechazos</text><line x1="640" y1="906" x2="334" y2="906" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#fr)"/><text x="485" y="899" font-size="13"  text-anchor="middle" fill="#b91c1c" >Correo inexistente, contraseña errónea o cuenta deshabilitada → 401 «Correo o contraseña incorrectos.»</text><rect x="430" y="926" width="420" height="30" rx="6" fill="#fee2e2" stroke="#b91c1c"/><text x="640" y="946" font-size="12"  text-anchor="middle" fill="#111827" >Mismo mensaje y mismo tiempo: no revela si existe la cuenta</text><line x1="640" y1="988" x2="334" y2="988" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#fr)"/><text x="485" y="981" font-size="13"  text-anchor="middle" fill="#b91c1c" >6.º intento fallido seguido → 429 DEMASIADOS_INTENTOS</text><line x1="640" y1="1030" x2="334" y2="1030" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#fr)"/><text x="485" y="1023" font-size="13"  text-anchor="middle" fill="#b91c1c" >Sin cabecera Bearer → 401 NO_AUTENTICADO</text><line x1="930" y1="1072" x2="334" y2="1072" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#fr)"/><text x="630" y="1065" font-size="13"  text-anchor="middle" fill="#b91c1c" >Token alterado, vencido, otro aud/iss o alg «none» → 401 SESION_INVALIDA</text><line x1="930" y1="1114" x2="334" y2="1114" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#fr)"/><text x="630" y="1107" font-size="13"  text-anchor="middle" fill="#b91c1c" >Sesión cerrada (ver ≠ version_sesion) o cuenta deshabilitada → 401</text><line x1="930" y1="1156" x2="334" y2="1156" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#fr)"/><text x="630" y="1149" font-size="13"  text-anchor="middle" fill="#b91c1c" >Rol insuficiente → 403 PERMISO_DENEGADO · pedido ajeno → 404</text><rect x="120" y="1176" width="420" height="30" rx="6" fill="#fee2e2" stroke="#b91c1c"/><text x="330" y="1196" font-size="12"  text-anchor="middle" fill="#111827" >React borra el token y lleva a Ingreso</text><rect x="20" y="1214" width="1360" height="30" fill="#e0e7ff"/><text x="40" y="1234" font-size="15" font-weight="bold"  fill="#312e81" >4 · Cierre de sesión</text><line x1="330" y1="1268" x2="636" y2="1268" stroke="#1f2937" stroke-width="2"  marker-end="url(#f)"/><text x="485" y="1261" font-size="13"  text-anchor="middle" fill="#111827" >POST /api/auth/logout · Bearer &lt;token&gt;</text><line x1="640" y1="1310" x2="1196" y2="1310" stroke="#1f2937" stroke-width="2"  marker-end="url(#f)"/><text x="920" y="1303" font-size="13"  text-anchor="middle" fill="#111827" >UPDATE usuario SET version_sesion = version_sesion + 1</text><line x1="640" y1="1352" x2="334" y2="1352" stroke="#1f2937" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#f)"/><text x="485" y="1345" font-size="13"  text-anchor="middle" fill="#111827" >204 · todos los tokens anteriores dejan de valer</text></svg>