lic">clasifica</text><polyline points="790,170 880,170" fill="none" stroke="#374151" stroke-width="2"/><text x="796" y="190" font-size="13" font-weight="bold" text-anchor="start" fill="#b91c1c" >1</text><text x="874" y="190" font-size="13" font-weight="bold" text-anchor="end" fill="#b91c1c" >0..*</text><text x="835" y="162" font-size="11"  text-anchor="middle" fill="#374151" font-style="italic">aparece en</text><polyline points="1300,170 1210,170" fill="none" stroke="#374151" stroke-width="2"/><text x="1294" y="190" font-size="13" font-weight="bold" text-anchor="end" fill="#b91c1c" >1</text><text x="1216" y="190" font-size="13" font-weight="bold" text-anchor="start" fill="#b91c1c" >1..*</text><text x="1255" y="162" font-size="11"  text-anchor="middle" fill="#374151" font-style="italic">contiene</text><polyline points="340,680 430,680" fill="none" stroke="#374151" stroke-width="2"/><text x="346" y="700" font-size="13" font-weight="bold" text-anchor="start" fill="#b91c1c" >0..1</text><text x="424" y="700" font-size="13" font-weight="bold" text-anchor="end" fill="#b91c1c" >0..*</text><text x="385" y="672" font-size="11"  text-anchor="middle" fill="#374151" font-style="italic">preferida</text><polyline points="880,680 790,680" fill="none" stroke="#374151" stroke-width="2"/><text x="874" y="700" font-size="13" font-weight="bold" text-anchor="end" fill="#b91c1c" >1</text><text x="796" y="700" font-size="13" font-weight="bold" text-anchor="start" fill="#b91c1c" >0..1</text><text x="835" y="672" font-size="11"  text-anchor="middle" fill="#374151" font-style="italic">perfil</text><polyline points="1080,620 1080,560 1400,560 1400,450" fill="none" stroke="#374151" stroke-width="2"/><text x="1088" y="602" font-size="13" font-weight="bold" text-anchor="start" fill="#b91c1c" >0..1</text><text x="1408" y="476" font-size="13" font-weight="bold" text-anchor="start" fill="#b91c1c" >0..*</text><text x="1240" y="552" font-size="12"  text-anchor="middle" fill="#374151" font-style="italic">compra (cliente)</text><polyline points="1180,620 1180,590 1600,590 1600,450" fill="none" stroke="#374151" stroke-width="2"/><text x="1188" y="602" font-size="13" font-weight="bold" text-anchor="start" fill="#b91c1c" >0..1</text><text x="1608" y="476" font-size="13" font-weight="bold" text-anchor="start" fill="#b91c1c" >0..*</text><text x="1400" y="582" font-size="12"  text-anchor="middle" fill="#374151" font-style="italic">entrega (repartidor)</text><polyline points="190,620 190,540 1340,540 1340,450" fill="none" stroke="#374151" stroke-width="2"/><text x="198" y="602" font-size="13" font-weight="bold" text-anchor="start" fill="#b91c1c" >1</text><text x="1348" y="476" font-size="13" font-weight="bold" text-anchor="start" fill="#b91c1c" >0..*</text><text x="700" y="532" font-size="12"  text-anchor="middle" fill="#374151" font-style="italic">se despacha en</text><text x="40" y="1010" font-size="13"   fill="#374151" >Reglas que la base hace cumplir: correo, RUN, nombre de categoría y número de pedido únicos; precios &gt; 0, stock ≥ 0 y cantidades &gt; 0;</text><text x="40" y="1032" font-size="13"   fill="#374151" >un pedido pendiente no tiene repartidor y desde «asignado» siempre lo tiene; el cobro existe solo si está entregado; un producto o una categoría</text><text x="40" y="1054" font-size="13"   fill="#374151" >con registros asociados no se borra (RESTRICT): el producto se retira; al borrar un pedido se borran sus líneas (CASCADE). Las contraseñas solo se guardan como hash Argon2id.</text></svg>