openapi: 3.1.0
info:
  title: API Gas El Volcán · Evaluación Parcial 3
  version: 0.2.0
  description: Usuarios, autenticación y roles, catálogo y pedidos. API
    versionada. Precio, total, identidad y permisos se comprueban en el
    servidor. Los datos iniciales provienen del catálogo del caso.
servers:
  - url: /
    description: Servidor actual
tags:
  - name: Autenticación
  - name: Usuarios
  - name: Productos
  - name: Pedidos
  - name: Referencias
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de POST /api/v1/auth/login; vigencia 15 minutos. El cierre de
        sesión y los cambios de usuario revocan los tokens.
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - codigo
            - mensaje
          properties:
            codigo:
              type: string
              example: VALIDACION
            mensaje:
              type: string
              example: Revisa los datos enviados.
            detalles:
              type: object
              additionalProperties:
                type: string
              example:
                correo: Ingresa un correo válido.
    RegistroEntrada:
      type: object
      additionalProperties: false
      required:
        - nombre
        - apellidos
        - run
        - correo
        - contrasena
        - tipoCliente
      properties:
        nombre: &a1
          type: string
          minLength: 2
          maxLength: 80
          example: Ana
        apellidos: &a2
          type: string
          minLength: 2
          maxLength: 80
          example: Pérez Soto
        run:
          type: string
          pattern: ^[0-9]{7,8}[0-9K]$
          example: 12345678K
          description: Sin puntos ni guion
        correo: &a3
          type: string
          format: email
          example: ana@ejemplo.cl
        contrasena: &a4
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
          example: Ficticia2026
        tipoCliente:
          type: string
          enum:
            - residencial
            - comercial
        direccion:
          type: string
          maxLength: 200
          default: ""
          example: Av. Libertad 123
        zonaId:
          type:
            - string
            - "null"
          example: centro
          description: Opcional
    IngresoEntrada:
      type: object
      additionalProperties: false
      required:
        - correo
        - contrasena
      properties:
        correo:
          type: string
          format: email
          example: ana@ejemplo.cl
        contrasena:
          type: string
          writeOnly: true
          example: Ficticia2026
    TokenAcceso:
      type: object
      description: Generado por el servidor.
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.…
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Segundos de vigencia
          example: 900
    Usuario:
      type: object
      description: Todos los campos los genera o guarda el servidor. Nunca incluye el
        hash de la contraseña.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          example: 019a6f2c-1d2e-7c3b-9a10-5b6c7d8e9f00
        correo: &a7
          type: string
          example: ana@ejemplo.cl
        nombre: &a5
          type: string
          example: Ana
        apellidos: &a6
          type: string
          example: Pérez Soto
        rol: &a8
          type: string
          enum:
            - cliente
            - operadora
            - repartidor
            - administracion
          readOnly: false
        perfil:
          type: object
          description: Solo para clientes
          properties:
            run:
              type: string
              example: 12345678K
            tipoCliente:
              type: string
              enum:
                - residencial
                - comercial
            direccion:
              type: string
            zonaId:
              type:
                - string
                - "null"
        estado: &a9
          type: string
          enum:
            - activo
            - deshabilitado
    Producto:
      type: object
      properties:
        codigo:
          type: string
          pattern: ^[A-Z]{2}[0-9]{3}$
          example: CL002
        nombre:
          type: string
          example: Cilindro GLP 11 kg
        descripcion:
          type: string
        unidad:
          type: string
          example: Unidad
        categoria:
          type: string
          example: Cilindros de Gas
        precioResidencial:
          type: integer
          minimum: 1
          example: 12000
        precioComercial:
          type: integer
          minimum: 1
          example: 11000
        stock:
          type: integer
          minimum: 0
          example: 200
        destacado:
          type: boolean
    ProductoEntrada:
      type: object
      additionalProperties: false
      required:
        - codigo
        - nombre
        - descripcion
        - unidad
        - categoria
        - precioResidencial
        - precioComercial
        - stock
      properties:
        codigo:
          type: string
          pattern: ^[A-Z]{2}[0-9]{3}$
        nombre:
          type: string
          minLength: 3
          maxLength: 100
        descripcion:
          type: string
          maxLength: 500
        unidad:
          type: string
        categoria:
          type: string
        precioResidencial:
          type: integer
          minimum: 1
        precioComercial:
          type: integer
          minimum: 1
        stock:
          type: integer
          minimum: 0
        destacado:
          type: boolean
          default: false
    Categoria:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        nombre:
          type: string
          minLength: 3
          maxLength: 60
          example: Reguladores
    Zona:
      type: object
      properties:
        id:
          type: string
          example: centro
        nombre:
          type: string
          example: Zona Centro
        comunas:
          type: string
        dias:
          type: string
        horario:
          type: string
        tiempoEstimado:
          type: string
    PedidoEntrada:
      type: object
      additionalProperties: false
      description: Solicitud de una cuenta cliente. El dueño sale del JWT y la tarifa
        del perfil en la base. Se reservan stock y precio vigente en una
        transacción.
      required:
        - lineas
        - nombre
        - apellidos
        - correo
        - direccion
        - zonaId
        - tipoCliente
      properties:
        lineas:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - codigo
              - cantidad
              - precioEsperado
            properties:
              codigo:
                type: string
                example: CL002
              cantidad:
                type: integer
                minimum: 1
                example: 2
              precioEsperado:
                type: integer
                minimum: 1
                description: Precio mostrado en el resumen. Se compara con el vigente; un cambio
                  produce 409. El servidor calcula el total.
            additionalProperties: false
          maxItems: 100
        nombre:
          type: string
          example: Ana
        apellidos:
          type: string
          example: Pérez Soto
        correo:
          type: string
          format: email
          example: ana@ejemplo.cl
        direccion:
          type: string
          example: Av. Libertad 123
        zonaId:
          type: string
          example: centro
        tipoCliente:
          type: string
          enum:
            - residencial
            - comercial
          description: Con sesión de cliente se usa el de su perfil
    Pedido:
      type: object
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: integer
        clienteId:
          type: string
          format: uuid
        nombre:
          type: string
        apellidos:
          type: string
        correo:
          type: string
          format: email
        direccion:
          type: string
        zonaId:
          type: string
        zonaNombre:
          type: string
        tiempoEstimado:
          type: string
        tipoCliente:
          type: string
          enum:
            - residencial
            - comercial
        total:
          type: integer
        estado:
          type: string
          enum:
            - pendiente
            - asignado
            - en_camino
            - entregado
        repartidorId:
          type:
            - string
            - "null"
          format: uuid
        repartidor:
          type:
            - string
            - "null"
        cobradoEn:
          type:
            - string
            - "null"
          format: date-time
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time
        lineas:
          type: array
          items:
            type: object
            properties:
              codigo:
                type: string
              nombre:
                type: string
              cantidad:
                type: integer
              precioUnitario:
                type: integer
              subtotal:
                type: integer
    PersonalEntrada:
      type: object
      additionalProperties: false
      required:
        - nombre
        - apellidos
        - correo
        - contrasena
        - rol
      properties:
        nombre: *a1
        apellidos: *a2
        correo: *a3
        contrasena: *a4
        rol:
          type: string
          enum:
            - administracion
            - operadora
            - repartidor
    UsuarioCambio:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nombre: *a5
        apellidos: *a6
        correo: *a7
        rol: *a8
        estado: *a9
    AsignacionEntrada:
      type: object
      additionalProperties: false
      required:
        - repartidorId
      properties:
        repartidorId:
          type: string
          format: uuid
    EstadoEntrada:
      type: object
      additionalProperties: false
      required:
        - estado
      properties:
        estado:
          type: string
          enum:
            - en_camino
            - entregado
  responses:
    Error400:
      description: Datos inválidos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error401:
      description: Sesión ausente, vencida o revocada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error403:
      description: Rol o propiedad insuficiente.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error404:
      description: Recurso inexistente.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error409:
      description: Conflicto de unicidad, stock, precio o estado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error429:
      description: Demasiados intentos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error500:
      description: Error interno.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
paths:
  /api/v1/auth/register:
    post:
      tags:
        - Autenticación
      summary: Registrar un cliente
      description: Crea siempre una cuenta con rol cliente (lo asigna el servidor).
        Rechaza campos extra como «rol». La contraseña se guarda solo como hash
        Argon2id.
      x-estado: implementado
      x-pantalla: Registro (/registro)
      x-entidades:
        - usuario
        - perfil_cliente
      x-permisos: Público
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistroEntrada"
      responses:
        "201":
          description: Cuenta creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
  /api/v1/auth/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión
      description: Verifica el hash y emite un JWT HS256 (sub, iss, aud, iat, exp,
        jti, ver). Ante cualquier falla responde el mismo mensaje genérico.
        Máximo 5 intentos fallidos cada 15 minutos por cuenta y 20 por IP.
      x-estado: implementado
      x-pantalla: Ingreso (/ingreso) y Acceso del personal (/personal)
      x-entidades:
        - usuario
      x-permisos: Público
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngresoEntrada"
      responses:
        "200":
          description: Acceso correcto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenAcceso"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
  /api/v1/auth/logout:
    post:
      tags:
        - Autenticación
      summary: Cerrar sesión
      description: Incrementa la versión de sesión del usuario; todos sus tokens
        emitidos dejan de ser aceptados de inmediato.
      x-estado: implementado
      x-pantalla: Botón «Cerrar sesión»
      x-entidades:
        - usuario
      x-permisos: Cualquier usuario autenticado
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Sesión cerrada
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
  /api/v1/auth/me:
    get:
      tags:
        - Autenticación
      summary: Consultar la identidad del token
      x-estado: implementado
      x-permisos: Cuenta autenticada
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Operación realizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
  /api/v1/productos:
    get:
      tags:
        - Productos
      summary: Consultar el catálogo activo
      x-estado: implementado
      x-permisos: Público
      security: []
      parameters:
        - name: busqueda
          in: query
          schema:
            type: string
            maxLength: 60
        - name: categoria
          in: query
          schema:
            type: string
            maxLength: 60
      responses:
        "200":
          description: Operación realizada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Producto"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
    post:
      tags:
        - Productos
      summary: Crear producto
      x-estado: implementado
      x-permisos: Administración
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductoEntrada"
      responses:
        "201":
          description: Creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
  /api/v1/productos/{codigo}:
    get:
      tags:
        - Productos
      summary: Consultar producto
      x-estado: implementado
      x-permisos: Público
      security: []
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Operación realizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
    put:
      tags:
        - Productos
      summary: Reemplazar producto; código inmutable
      x-estado: implementado
      x-permisos: Administración
      security:
        - bearerAuth: []
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductoEntrada"
      responses:
        "200":
          description: Operación realizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
    delete:
      tags:
        - Productos
      summary: Eliminar producto sin pedidos; en uso responde 409
      x-estado: implementado
      x-permisos: Administración
      security:
        - bearerAuth: []
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Operación realizada, sin cuerpo.
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
  /api/v1/usuarios:
    get:
      tags:
        - Usuarios
      summary: Listar usuarios
      x-estado: implementado
      x-permisos: Administración
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Operación realizada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Usuario"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
    post:
      tags:
        - Usuarios
      summary: Crear personal; el registro público crea clientes
      x-estado: implementado
      x-permisos: Administración
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalEntrada"
      responses:
        "201":
          description: Creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
  /api/v1/usuarios/{id}:
    get:
      tags:
        - Usuarios
      summary: Consultar usuario
      x-estado: implementado
      x-permisos: Administración o propia cuenta
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Operación realizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
    patch:
      tags:
        - Usuarios
      summary: Modificar usuario y revocar sus sesiones
      x-estado: implementado
      x-permisos: Administración
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioCambio"
      responses:
        "200":
          description: Operación realizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
