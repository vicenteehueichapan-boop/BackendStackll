openapi: 3.1.0
info:
  title: API Gas El Volcán · Evaluación Parcial 3
  version: 0.2.0
  description: Usuarios, autenticación y roles, catálogo y pedidos. API versionada. Precio, total,
    identidad y permisos se comprueban en el servidor. Los datos iniciales provienen del catálogo
    del caso.
servers:
  - url: /
    description: Servidor actual
tags:
  - name: Autenticación
  - name: Usuarios
  - name: Productos
  - name: Pedidos
  - name: Referencias
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de POST /api/v1/auth/login; vigencia 15 minutos. El cierre de sesión y los
        cambios de usuario revocan los tokens.
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - codigo
            - mensaje
          properties:
            codigo:
              type: string
              example: VALIDACION
            mensaje:
              type: string
              example: Revisa los datos enviados.
            detalles:
              type: object
              additionalProperties:
                type: string
              example:
                correo: Ingresa un correo válido.
    RegistroEntrada:
      type: object
      additionalProperties: false
      required:
        - nombre
        - apellidos
        - run
        - correo
        - contrasena
        - tipoCliente
      properties:
        nombre: &a1
          type: string
          minLength: 2
          maxLength: 80
          example: Ana
        apellidos: &a2
          type: string
          minLength: 2
          maxLength: 80
          example: Pérez Soto
        run:
          type: string
          pattern: ^[0-9]{7,8}[0-9K]$
          example: 12345678K
          description: Sin puntos ni guion
        correo: &a3
          type: string
          format: email
          example: ana@ejemplo.cl
          maxLength: 254
        contrasena: &a4
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
          example: Ficticia2026
        tipoCliente:
          type: string
          enum:
            - residencial
            - comercial
        direccion:
          type: string
          maxLength: 200
          default: ""
          example: Av. Libertad 123
        zonaId:
          type:
            - string
            - "null"
          example: centro
          description: Opcional
          pattern: ^[a-z]+$
    IngresoEntrada:
      type: object
      additionalProperties: false
      required:
        - correo
        - contrasena
      properties:
        correo:
          type: string
          format: email
          example: ana@ejemplo.cl
          maxLength: 254
        contrasena:
          type: string
          writeOnly: true
          example: Ficticia2026
          minLength: 1
          maxLength: 128
    TokenAcceso:
      type: object
      description: Generado por el servidor.
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.…
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Segundos de vigencia
          example: 900
      required:
        - accessToken
        - tokenType
        - expiresIn
    Usuario:
      type: object
      description: Datos públicos de la cuenta, sin hash ni versión de sesión. GET /auth/me agrega perfil
        para clientes; el CRUD de usuarios incluye estado. El registro público devuelve id, correo,
        nombre, apellidos y rol.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          example: 019a6f2c-1d2e-7c3b-9a10-5b6c7d8e9f00
        correo:
          type: string
          example: ana@ejemplo.cl
        nombre:
          type: string
          example: Ana
        apellidos:
          type: string
          example: Pérez Soto
        rol: &a5
          type: string
          enum:
            - cliente
            - operadora
            - repartidor
            - administracion
          readOnly: false
        perfil:
          type: object
          description: Solo para clientes
          properties:
            run:
              type: string
              example: 12345678K
            tipoCliente:
              type: string
              enum:
                - residencial
                - comercial
            direccion:
              type: string
            zonaId:
              type:
                - string
                - "null"
        estado: &a6
          type: string
          enum:
            - activo
            - deshabilitado
    Producto:
      type: object
      properties:
        codigo:
          type: string
          pattern: ^[A-Z]{2}[0-9]{3}$
          example: CL002
        nombre:
          type: string
          example: Cilindro GLP 11 kg
        descripcion:
          type: string
        unidad:
          type: string
          example: Unidad
        categoria:
          type: string
          example: Cilindros de Gas
        precioResidencial:
          type: integer
          minimum: 1
          example: 12000
        precioComercial:
          type: integer
          minimum: 1
          example: 11000
        stock:
          type: integer
          minimum: 0
          example: 200
        destacado:
          type: boolean
    ProductoEntrada:
      type: object
      additionalProperties: false
      required:
        - codigo
        - nombre
        - descripcion
        - unidad
        - categoria
        - precioResidencial
        - precioComercial
        - stock
      properties:
        codigo:
          type: string
          pattern: ^[A-Z]{2}[0-9]{3}$
          example: ZZ993
        nombre:
          type: string
          minLength: 3
          maxLength: 100
        descripcion:
          type: string
          maxLength: 500
        unidad:
          type: string
          minLength: 1
          maxLength: 50
          example: Unidad
        categoria:
          type: string
          minLength: 3
          maxLength: 60
          example: Cilindros de Gas
          description: Nombre de una categoría existente, obtenida con GET /api/v1/categorias.
        precioResidencial:
          type: integer
          minimum: 1
          maximum: 2147483647
        precioComercial:
          type: integer
          minimum: 1
          maximum: 2147483647
        stock:
          type: integer
          minimum: 0
          maximum: 2147483647
        destacado:
          type: boolean
          default: false
    Categoria:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        nombre:
          type: string
          minLength: 3
          maxLength: 60
          example: Reguladores
    Zona:
      type: object
      properties:
        id:
          type: string
          example: centro
        nombre:
          type: string
          example: Zona Centro
        comunas:
          type: string
        dias:
          type: string
        horario:
          type: string
        tiempoEstimado:
          type: string
    PedidoEntrada:
      type: object
      additionalProperties: false
      description: Solicitud de una cuenta cliente. El dueño sale del JWT y la tarifa del perfil en la
        base. Se reservan stock y precio vigente en una transacción.
      required:
        - lineas
        - nombre
        - apellidos
        - correo
        - direccion
        - zonaId
        - tipoCliente
      properties:
        lineas:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - codigo
              - cantidad
              - precioEsperado
            properties:
              codigo:
                type: string
                example: CL002
                pattern: ^[A-Z]{2}[0-9]{3}$
              cantidad:
                type: integer
                minimum: 1
                example: 2
                maximum: 10000
              precioEsperado:
                type: integer
                minimum: 1
                description: Precio mostrado en el resumen. Se compara con el vigente; un cambio produce 409. El
                  servidor calcula el total.
                maximum: 2147483647
                example: 12000
            additionalProperties: false
          maxItems: 100
          description: Entre 1 y 100 productos, sin códigos repetidos.
        nombre:
          type: string
          minLength: 2
          maxLength: 80
          example: Ana
        apellidos:
          type: string
          minLength: 2
          maxLength: 80
          example: Pérez Soto
        correo:
          type: string
          format: email
          example: ana@ejemplo.cl
          maxLength: 254
        direccion:
          type: string
          example: Av. Libertad 123
          minLength: 5
          maxLength: 200
        zonaId:
          type: string
          example: centro
          pattern: ^[a-z]+$
        tipoCliente:
          type: string
          enum:
            - residencial
            - comercial
          description: Campo requerido del DTO de React; el servidor utiliza la tarifa del perfil guardado, no
            confía en este valor para calcular el pedido.
    Pedido:
      type: object
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: integer
        clienteId:
          type: string
          format: uuid
        nombre:
          type: string
        apellidos:
          type: string
        correo:
          type: string
          format: email
        direccion:
          type: string
        zonaId:
          type: string
        zonaNombre:
          type: string
        tiempoEstimado:
          type: string
        tipoCliente:
          type: string
          enum:
            - residencial
            - comercial
        total:
          type: integer
        estado:
          type: string
          enum:
            - pendiente
            - asignado
            - en_camino
            - entregado
        repartidorId:
          type:
            - string
            - "null"
          format: uuid
        repartidor:
          type:
            - string
            - "null"
        cobradoEn:
          type:
            - string
            - "null"
          format: date-time
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time
        lineas:
          type: array
          items:
            type: object
            properties:
              codigo:
                type: string
              nombre:
                type: string
              cantidad:
                type: integer
              precioUnitario:
                type: integer
              subtotal:
                type: integer
    PersonalEntrada:
      type: object
      additionalProperties: false
      required:
        - nombre
        - apellidos
        - correo
        - contrasena
        - rol
      properties:
        nombre: *a1
        apellidos: *a2
        correo: *a3
        contrasena: *a4
        rol:
          type: string
          enum:
            - administracion
            - operadora
            - repartidor
    UsuarioCambio:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 80
          example: Ana
        apellidos:
          type: string
          minLength: 2
          maxLength: 80
          example: Pérez Soto
        correo:
          type: string
          format: email
          example: ana@ejemplo.cl
          maxLength: 254
        rol: *a5
        estado: *a6
    AsignacionEntrada:
      type: object
      additionalProperties: false
      required:
        - repartidorId
      properties:
        repartidorId:
          type: string
          format: uuid
    EstadoEntrada:
      type: object
      additionalProperties: false
      required:
        - estado
      properties:
        estado:
          type: string
          enum:
            - en_camino
            - entregado
    Repartidor:
      type: object
      required:
        - id
        - nombre
        - apellidos
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        apellidos:
          type: string
  responses:
    Error400:
      description: Datos inválidos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error401:
      description: Sesión ausente, vencida o revocada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error403:
      description: Rol o propiedad insuficiente.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error404:
      description: Recurso inexistente.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error409:
      description: Conflicto de unicidad, stock, precio o estado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error429:
      description: Demasiados intentos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error500:
      description: Error interno.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error413:
      description: El JSON supera el máximo de 20 kB permitido por la API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
paths:
  /api/v1/auth/register:
    post:
      tags:
        - Autenticación
      summary: Registrar un cliente
      description: Acceso público. El servidor asigna siempre el rol cliente; no acepta rol ni
        identificador enviados por quien se registra. Crea siempre una cuenta con rol cliente (lo
        asigna el servidor). Rechaza campos extra como «rol». La contraseña se guarda solo como hash
        Argon2id.
      x-estado: implementado
      x-pantalla: Registro (/registro)
      x-entidades:
        - usuario
        - perfil_cliente
      x-permisos: Público
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistroEntrada"
      responses:
        "201":
          description: Cuenta creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "400":
          $ref: "#/components/responses/Error400"
        "409":
          $ref: "#/components/responses/Error409"
        "413":
          $ref: "#/components/responses/Error413"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
  /api/v1/auth/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión
      description: Acceso público. La respuesta contiene únicamente accessToken, tokenType y expiresIn; el
        perfil se consulta después en GET /api/v1/auth/me. Verifica el hash y emite un JWT HS256
        (sub, iss, aud, iat, exp, jti, ver). Ante cualquier falla responde el mismo mensaje
        genérico. Máximo 5 intentos fallidos cada 15 minutos por cuenta y 20 por IP.
      x-estado: implementado
      x-pantalla: Ingreso (/ingreso) y Acceso del personal (/personal)
      x-entidades:
        - usuario
      x-permisos: Público
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngresoEntrada"
      responses:
        "200":
          description: Acceso correcto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenAcceso"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          description: Correo o contraseña incorrectos. Mismo mensaje genérico exista o no la cuenta, o si
            está deshabilitada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/Error413"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
  /api/v1/auth/logout:
    post:
      tags:
        - Autenticación
      summary: Cerrar sesión
      description: Cualquier cuenta autenticada. Revoca todos los tokens anteriores de la cuenta mediante
        version_sesion; no requiere refresh token. Incrementa la versión de sesión del usuario;
        todos sus tokens emitidos dejan de ser aceptados de inmediato.
      x-estado: implementado
      x-pantalla: Botón «Cerrar sesión»
      x-entidades:
        - usuario
      x-permisos: Cualquier usuario autenticado
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Sesión cerrada
        "401":
          $ref: "#/components/responses/Error401"
        "500":
          $ref: "#/components/responses/Error500"
  /api/v1/auth/me:
    get:
      tags:
        - Autenticación
      summary: Consultar la identidad del token
      x-estado: implementado
      x-permisos: Cuenta autenticada
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Operación realizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "401":
          $ref: "#/components/responses/Error401"
        "500":
          $ref: "#/components/responses/Error500"
      description: Cualquier cuenta autenticada. La identidad procede del JWT verificado; no recibe un
        identificador de otra persona.
  /api/v1/productos:
    get:
      tags:
        - Productos
      summary: Consultar el catálogo activo
      x-estado: implementado
      x-permisos: Público
      security: []
      parameters:
        - name: busqueda
          in: query
          schema:
            type: string
            maxLength: 60
        - name: categoria
          in: query
          schema:
            type: string
            maxLength: 60
      responses:
        "200":
          description: Operación realizada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Producto"
        "400":
          $ref: "#/components/responses/Error400"
        "500":
          $ref: "#/components/responses/Error500"
      description: Acceso público. La lista contiene productos activos; sin coincidencias devuelve un
        arreglo vacío. Solo admite los filtros busqueda y categoria.
    post:
      tags:
        - Productos
      summary: Crear producto
      x-estado: implementado
      x-permisos: Administración
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductoEntrada"
            example:
              codigo: ZZ993
              nombre: Cilindro de demostración
              descripcion: Datos ficticios para comprobar el CRUD.
              unidad: Unidad
              categoria: Cilindros de Gas
              precioResidencial: 12000
              precioComercial: 11000
              stock: 4
              destacado: false
      responses:
        "201":
          description: Creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "409":
          $ref: "#/components/responses/Error409"
        "413":
          $ref: "#/components/responses/Error413"
        "500":
          $ref: "#/components/responses/Error500"
      description: Solo administración. La categoría debe existir; un código duplicado produce 409.
  /api/v1/productos/{codigo}:
    get:
      tags:
        - Productos
      summary: Consultar producto
      x-estado: implementado
      x-permisos: Público
      security: []
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
            pattern: ^[A-Z]{2}[0-9]{3}$
            example: CL002
      responses:
        "200":
          description: Operación realizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
      description: Acceso público. Un código con formato inválido produce 400; un producto inexistente o
        retirado produce 404.
    put:
      tags:
        - Productos
      summary: Reemplazar producto; código inmutable
      x-estado: implementado
      x-permisos: Administración
      security:
        - bearerAuth: []
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
            pattern: ^[A-Z]{2}[0-9]{3}$
            example: CL002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductoEntrada"
            example:
              codigo: CL002
              nombre: Cilindro de demostración
              descripcion: Datos ficticios para comprobar el CRUD.
              unidad: Unidad
              categoria: Cilindros de Gas
              precioResidencial: 12000
              precioComercial: 11000
              stock: 4
              destacado: false
      responses:
        "200":
          description: Operación realizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "413":
          $ref: "#/components/responses/Error413"
        "500":
          $ref: "#/components/responses/Error500"
      description: Solo administración. Reemplaza los campos editables del producto activo; el código del
        cuerpo debe coincidir con el de la ruta. La categoría debe existir.
    delete:
      tags:
        - Productos
      summary: Eliminar producto sin pedidos; en uso responde 409
      x-estado: implementado
      x-permisos: Administración
      security:
        - bearerAuth: []
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
            pattern: ^[A-Z]{2}[0-9]{3}$
            example: CL002
      responses:
        "204":
          description: Operación realizada, sin cuerpo.
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
      description: Solo administración. Elimina un producto activo sin referencias. Si participa en líneas
        de pedido devuelve 409 y conserva el registro.
  /api/v1/usuarios:
    get:
      tags:
        - Usuarios
      summary: Listar usuarios
      x-estado: implementado
      x-permisos: Administración
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Operación realizada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Usuario"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "500":
          $ref: "#/components/responses/Error500"
      description: Solo administración. Devuelve los datos públicos de cuentas activas y deshabilitadas,
        sin hashes ni versiones de sesión.
    post:
      tags:
        - Usuarios
      summary: Crear personal; el registro público crea clientes
      x-estado: implementado
      x-permisos: Administración
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalEntrada"
      responses:
        "201":
          description: Creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "409":
          $ref: "#/components/responses/Error409"
        "413":
          $ref: "#/components/responses/Error413"
        "500":
